async function open(pw){
  if(!(window.crypto&&crypto.subtle))throw new Error('NOCRYPTO');
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b(S),iterations:IT,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const d=await crypto.subtle.decrypt({name:'AES-GCM',iv:b(V)},k,b(C));
  return new TextDecoder().decode(d);
}
async function go(pw,remember){

}
